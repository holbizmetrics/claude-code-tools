[project]
name = "gitwat"
version = "0.1.0"
description = "git, wat? A deterministic git coach that shows the command before running it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "holbizmetrics" }]
dependencies = ["rapidfuzz>=3.0"]

[project.scripts]
gitwat = "gitwat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitwat"]

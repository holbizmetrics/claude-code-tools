# gitwat pain-point database. Hand-edited. One source of truth.
#
# Fields:
#   id          stable identifier, dot-separated (category.name)
#   intents     3-5 canonical phrasings; fuzzy matcher handles variation
#   command     the exact git command to teach
#   explanation one sentence, what the command does
#   safety      readonly | worktree | history | destructive
#   requires    list of repo-state checks that must pass for this to appear
#   warning     optional, shown before execution

[[painpoint]]
id = "remotes.list"
intents = [
  "show remotes",
  "what repo is this connected to",
  "which remote am i using",
  "where does this push to",
]
command = "git remote -v"
explanation = "Lists all configured remotes with their fetch and push URLs."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "status.current"
intents = [
  "what changed",
  "whats modified",
  "status",
  "whats staged",
  "what did i change",
]
command = "git status"
explanation = "Shows current branch, staged and unstaged changes, and untracked files."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "log.recent"
intents = [
  "recent commits",
  "what happened lately",
  "show history",
  "last commits",
]
command = "git log --oneline --graph --decorate -20"
explanation = "Shows the last 20 commits as a compact graph with branch and tag decorations."
safety = "readonly"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "branch.current"
intents = [
  "what branch am i on",
  "current branch",
  "which branch",
]
command = "git branch --show-current"
explanation = "Prints the name of the current branch (empty if detached HEAD)."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "diff.unstaged"
intents = [
  "what did i change in files",
  "show my unstaged changes",
  "diff working tree",
]
command = "git diff"
explanation = "Shows unstaged changes in the working tree, line by line."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "diff.staged"
intents = [
  "what am i about to commit",
  "show staged diff",
  "whats in the index",
]
command = "git diff --staged"
explanation = "Shows changes staged for the next commit, line by line."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "undo.last-commit-soft"
intents = [
  "undo my last commit but keep changes",
  "uncommit",
  "i messed up my commit message",
  "take back last commit",
]
command = "git reset --soft HEAD~1"
explanation = "Removes the last commit but keeps all its changes staged for a new commit."
safety = "history"
requires = ["in-repo", "has-commits"]
warning = "Safe only if you have not pushed this commit. If you pushed, prefer `git commit --amend` or a new commit."

[[painpoint]]
id = "undo.discard-file"
intents = [
  "discard changes to a file",
  "revert file to last commit",
  "undo edits in one file",
]
command = "git restore <file>"
explanation = "Discards unstaged changes to a file, restoring it to the last committed version."
safety = "worktree"
requires = ["in-repo", "has-commits", "dirty"]
warning = "The discarded changes cannot be recovered. Replace <file> with the actual path."

[[painpoint]]
id = "stash.save"
intents = [
  "save my changes for later",
  "put my work aside",
  "stash",
]
command = "git stash push -m \"wip\""
explanation = "Saves current uncommitted changes to the stash and cleans the working tree."
safety = "worktree"
requires = ["in-repo", "dirty"]

[[painpoint]]
id = "stash.pop"
intents = [
  "bring back my stashed changes",
  "restore stash",
  "unstash",
]
command = "git stash pop"
explanation = "Reapplies the most recent stash entry and removes it from the stash list."
safety = "worktree"
requires = ["in-repo", "has-stash"]
warning = "If the stash does not apply cleanly you will get merge conflicts to resolve."

[[painpoint]]
id = "push.current"
intents = [
  "send this branch to origin",
  "push my branch",
  "upload commits",
]
command = "git push"
explanation = "Pushes the current branch to its upstream remote."
safety = "history"
requires = ["in-repo", "has-commits", "has-upstream"]

[[painpoint]]
id = "push.set-upstream"
intents = [
  "push new branch first time",
  "set upstream",
  "push and track",
]
command = "git push -u origin HEAD"
explanation = "Pushes the current branch to origin and sets it as the upstream for future pulls and pushes."
safety = "history"
requires = ["in-repo", "has-commits", "has-remote"]

[[painpoint]]
id = "push.force-with-lease"
intents = [
  "force push safely",
  "push after rebase",
  "push rewritten history",
  "force push with safety net",
]
command = "git push --force-with-lease"
explanation = "Force-pushes the current branch, but refuses if the remote has moved since your last fetch — protects teammates' work."
safety = "history"
requires = ["in-repo", "has-commits", "has-upstream"]
warning = "Still rewrites remote history. Safe on solo feature branches; disruptive on shared branches where others have pulled your old commits."

[[painpoint]]
id = "fetch.remote"
intents = [
  "update remote tracking refs",
  "fetch from origin",
  "refresh what the remote has",
  "see whats new on origin without merging",
]
command = "git fetch"
explanation = "Downloads new commits from origin and updates origin/* refs. Read-only: does not touch your working tree, branches, or index."
safety = "readonly"
requires = ["in-repo", "has-remote"]

[[painpoint]]
id = "log.incoming"
intents = [
  "what does origin have that i dont",
  "incoming commits on main",
  "whats new on origin main",
  "commits on remote i havent pulled",
]
command = "git log HEAD..origin/main --oneline"
explanation = "Shows commits on origin/main that are not on your current branch. Run `git fetch` first to make the result current."
safety = "readonly"
requires = ["in-repo", "has-commits", "has-remote"]

[[painpoint]]
id = "diff.branches"
intents = [
  "compare my branch to main",
  "what does my branch change vs main",
  "diff against main",
  "branch differences from main",
]
command = "git diff main...HEAD"
explanation = "Shows everything your branch changes relative to main, using the fork point as the base (three dots)."
safety = "readonly"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "rebase.reword-n-back"
intents = [
  "change an old commit message",
  "reword a commit several back",
  "fix commit message not the last one",
  "edit past commit message",
]
command = "git rebase -i HEAD~<N>"
explanation = "Opens interactive rebase on the last N commits. Change `pick` to `reword` on the target line, save, then edit the message in the second editor that opens."
safety = "history"
requires = ["in-repo", "has-commits"]
warning = "Replace <N> with a number at least one greater than how far back the commit is. Force-push with --force-with-lease afterward. Safe only on branches others have not pulled."

[[painpoint]]
id = "rebase.onto-updated-main"
intents = [
  "rebase my branch onto origin main",
  "update feature branch against main",
  "catch up with main and reword",
  "rebase interactive onto current main",
]
command = "git rebase -i origin/main"
explanation = "Replays your branch commits on top of the current origin/main, with an interactive editor for rewording/squashing. Run `git fetch` first so origin/main is current."
safety = "history"
requires = ["in-repo", "has-commits", "has-remote"]
warning = "May introduce conflicts if new main commits touched the same lines. Force-push afterward. Moves your branch forward onto newer main."

[[painpoint]]
id = "rebase.fork-point"
intents = [
  "reword commits without moving onto newer main",
  "interactive rebase in place",
  "rebase from fork point only",
  "pure message fix no main catch up",
]
command = "git rebase -i $(git merge-base HEAD origin/main)"
explanation = "Opens interactive rebase starting at the exact point your branch diverged from origin/main. Lets you reword/squash your commits without pulling in newer main commits — pure in-place history surgery."
safety = "history"
requires = ["in-repo", "has-commits", "has-remote"]
warning = "Force-push afterward. Use this when you only want to fix messages, not catch up with main."

[[painpoint]]
id = "rebase.am-i-stuck"
intents = [
  "am i in a rebase",
  "is there a rebase in progress",
  "am i stuck in a rebase",
  "did a rebase pause",
]
command = "git status"
explanation = "If a rebase is paused (conflict, edit, or reword), git status prints `You are currently rebasing...` and tells you the next step. If not, it shows normal branch status."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "rebase.abort"
intents = [
  "cancel a rebase",
  "abort rebase",
  "get out of a stuck rebase",
  "undo rebase in progress",
]
command = "git rebase --abort"
explanation = "Cancels an in-progress rebase and restores the branch to exactly where it was before the rebase started. Safe — nothing committed is lost."
safety = "worktree"
requires = ["in-repo"]
warning = "Only affects an in-progress rebase. Does nothing if no rebase is running. Uncommitted edits made while the rebase was paused may be lost."

[[painpoint]]
id = "rebase.continue"
intents = [
  "continue rebase after conflict",
  "resume rebase",
  "keep rebasing after fix",
]
command = "git rebase --continue"
explanation = "Resumes a paused rebase after you've resolved conflicts (and `git add`ed the fixed files) or finished an `edit`/`reword` step."
safety = "history"
requires = ["in-repo"]

[[painpoint]]
id = "stash.before-pull"
intents = [
  "pull failed because of local changes",
  "pull refused dirty tree",
  "safely pull over uncommitted work",
  "pull while i have changes",
]
command = "git stash && git pull && git stash pop"
explanation = "Stashes local changes, pulls from the remote, then reapplies the stash. Use when `git pull` refuses with 'local changes would be overwritten'."
safety = "worktree"
requires = ["in-repo", "dirty", "has-upstream"]
warning = "If pull or the final `stash pop` hits conflicts, resolve them manually. The stash entry remains until you successfully pop it."

[[painpoint]]
id = "pickaxe.in-file"
intents = [
  "when did this string appear in this file",
  "find the commit that added or removed text in a file",
  "search a file's history for a string",
  "trace text changes in one specific file",
]
command = "git log -S \"<text>\" -- <path>"
explanation = "Lists commits that changed the count of <text> in <path>. The pickaxe (-S) finds where a literal string was introduced or removed in that one file."
safety = "readonly"
requires = ["in-repo", "has-commits"]
warning = "Quote multi-word strings literally: -S \"a b\". For regex patterns use -G instead of -S."

[[painpoint]]
id = "pickaxe.with-diffs"
intents = [
  "show diffs for commits that touched a string",
  "pickaxe with patches",
  "see what changed around a string in a file",
]
command = "git log -p -S \"<text>\" -- <path>"
explanation = "Same as the file-scoped pickaxe, plus each matching commit's diff. Use when you need full context, not just SHAs."
safety = "readonly"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "show.file-before-commit"
intents = [
  "what did this file look like before this commit",
  "previous version of a file before a commit",
  "show the file at the parent of a commit",
  "version of file just before X changed it",
]
command = "git show <sha>^:<path>"
explanation = "Prints <path> as it existed at the parent of <sha> — exactly what the file looked like just before that commit modified it. The trailing ^ means parent; ~N means N commits earlier."
safety = "readonly"
requires = ["in-repo", "has-commits"]
warning = "On zsh and Windows cmd.exe, ^ may be eaten by the shell. If output looks wrong, quote the whole revspec: git show \"<sha>^:<path>\"."

[[painpoint]]
id = "show.file-in-commit"
intents = [
  "what did this file change in this commit",
  "single-file diff inside a commit",
  "diff one file from a multi-file commit",
]
command = "git show <sha> -- <path>"
explanation = "Shows only the changes to <path> within commit <sha>, ignoring other files the commit touched."
safety = "readonly"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "pull.ff-only"
intents = [
  "pull without auto merging",
  "safe pull that refuses to merge",
  "pull only if fast forward",
  "pull or fail if branches diverged",
]
command = "git pull --ff-only"
explanation = "Updates your branch only if it can fast-forward. Refuses if the branches have diverged, forcing you to investigate before letting git auto-merge."
safety = "history"
requires = ["in-repo", "has-commits", "has-upstream"]
warning = "If --ff-only refuses, your branch has diverged from upstream. Run 'git status' and decide between rebase or merge before retrying without --ff-only."

[[painpoint]]
id = "log.first-on-file"
intents = [
  "when was this file first added",
  "earliest commits touching a file",
  "history of a file in chronological order",
  "show the oldest commits for a file",
]
command = "git log --reverse --pretty=format:\"%h %ai %s\" -- <path>"
explanation = "Lists every commit touching <path>, oldest-first, with short SHA, ISO timestamp, and message. Pipe to '| head -5' for just the earliest few."
safety = "readonly"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "log.behind-upstream"
intents = [
  "what commits am i behind on",
  "missing commits from upstream",
  "what would i pull",
  "show unpulled commits from upstream",
]
command = "git log HEAD..@{u} --oneline"
explanation = "Lists commits on your upstream branch that are not on yours — i.e. commits you would receive by pulling. @{u} is the upstream of the current branch."
safety = "readonly"
requires = ["in-repo", "has-commits", "has-upstream"]
warning = "Run 'git fetch' first so @{u} reflects current remote state. On zsh, @{u} may need quoting due to history-glob expansion."

[[painpoint]]
id = "commit.amend-message"
intents = [
  "fix the last commit message",
  "reword my latest commit",
  "change the message of my last commit",
  "correct a wrong commit message",
  "i used the wrong ticket number in my commit",
]
command = "git commit --amend -m \"<new message>\""
explanation = "Replaces the most recent commit's message while keeping its content. Only touches the tip commit; for older commits use an interactive rebase reword."
safety = "history"
requires = ["in-repo", "has-commits"]
warning = "Unstage first (git reset) or any staged changes get folded into the commit — amend commits the index, not just the message. If the commit was already pushed you must force-push (--force-with-lease) or ship it under a new branch name."

[[painpoint]]
id = "undo.unstage-all"
intents = [
  "unstage everything",
  "unstage all files",
  "clear the staging area",
  "i staged the wrong things",
  "take everything out of the index",
]
command = "git reset"
explanation = "Unstages all staged changes, leaving file contents untouched in the working tree. The inverse of git add. Nothing is lost."
safety = "worktree"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "branch.rename-local"
intents = [
  "rename my branch",
  "rename the current branch",
  "change the branch name",
  "give this branch a new name",
]
command = "git branch -m <new-name>"
explanation = "Renames the current branch locally. Does not touch the remote — the old remote branch and its upstream tracking remain until you push the new name and delete the old."
safety = "history"
requires = ["in-repo"]

[[painpoint]]
id = "branch.rename-pushed"
intents = [
  "rename a branch i already pushed",
  "rename a branch on the remote",
  "fix the name of a pushed branch",
  "move a branch to a new name on origin",
]
command = "git branch -m <new-name> && git push -u origin <new-name> && git push origin --delete <old-name>"
explanation = "Renames the branch locally, publishes the new name (setting upstream), then removes the old branch from the remote — there is no true server-side rename, it's push-new plus delete-old."
safety = "history"
requires = ["in-repo", "has-remote"]
warning = "Deleting the old branch closes any open MR/PR attached to it — reopen it on the new branch, or rename via the GitHub/GitLab web UI to preserve it. The renamed local branch keeps tracking the OLD upstream until the -u push repoints it."

[[painpoint]]
id = "branch.delete-remote"
intents = [
  "delete a branch on the remote",
  "remove a remote branch",
  "delete a branch from origin",
  "clean up a pushed branch",
]
command = "git push origin --delete <branch>"
explanation = "Deletes <branch> from the remote. Your local branch, if any, is untouched."
safety = "destructive"
requires = ["in-repo", "has-remote"]
warning = "Closes any open MR/PR whose source is this branch. Recoverable only by re-pushing the commits, which must still exist locally or in a backup ref."

[[painpoint]]
id = "safety.backup-before-rewrite"
intents = [
  "back up before rewriting history",
  "make a safety branch before a rebase",
  "bookmark the current commit before amend",
  "save a recovery point before force push",
]
command = "git branch backup/<name> <sha>"
explanation = "Creates a lightweight branch pointing at <sha> (e.g. the current tip) so the original commit stays reachable after an amend, rebase, or force-push. Delete it later with git branch -D backup/<name>."
safety = "worktree"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "pull.rebase"
intents = [
  "pull when my branch diverged",
  "remote is ahead update without a merge commit",
  "rebase pull",
  "push rejected because remote is ahead",
  "replay my commits on top of origin",
]
command = "git pull --rebase"
explanation = "Fetches the remote and replays your local commits on top of it — linear history, no merge commit. Use when a push was rejected because the remote has commits you don't."
safety = "history"
requires = ["in-repo", "has-commits", "has-upstream"]
warning = "If your commits and the incoming ones touched the same lines you'll resolve conflicts, then `git rebase --continue`. Only your unpushed commits are replayed."

[[painpoint]]
id = "reflog.recover"
intents = [
  "recover a lost commit",
  "undo a bad reset or rebase",
  "get back commits after a bad amend",
  "i lost work after reset --hard",
  "find where HEAD used to be",
]
command = "git reset --hard HEAD@{N}"
explanation = "Restores your branch to an earlier HEAD position from the reflog — run `git reflog` first to find the right HEAD@{N} (or SHA). Recovers commits lost to a bad reset, rebase, or amend."
safety = "destructive"
requires = ["in-repo", "has-commits"]
warning = "reset --hard discards uncommitted changes and any commits after the target — confirm HEAD@{N} is the state you want. The reflog is local-only and entries expire (about 90 days)."

[[painpoint]]
id = "cherry-pick.one"
intents = [
  "copy one commit onto this branch",
  "apply a single commit from another branch",
  "cherry pick a commit",
  "bring one commit over without merging the branch",
]
command = "git cherry-pick <sha>"
explanation = "Applies the changes from a single commit onto the current branch as a new commit, without merging the rest of its branch."
safety = "history"
requires = ["in-repo", "has-commits"]
warning = "If it doesn't apply cleanly, resolve conflicts then `git cherry-pick --continue`. Cherry-picking duplicates the change — avoid it if you'll also merge the source branch later."

[[painpoint]]
id = "checkout.detached-recover"
intents = [
  "get back to a branch from detached HEAD",
  "im in detached head state",
  "reattach to a branch",
  "leave detached HEAD",
]
command = "git switch <branch>"
explanation = "Reattaches you to a branch after a detached HEAD (e.g. from `git checkout <sha>`). `git switch -` returns to the branch you were just on."
safety = "worktree"
requires = ["in-repo", "has-commits"]
warning = "If you made commits while detached, save them first with `git branch <name>` — otherwise they become unreachable once you switch away."

[[painpoint]]
id = "log.follow-file"
intents = [
  "history of a file across renames",
  "track a file through its renames",
  "full history of a renamed file",
  "log a file including its old names",
]
command = "git log --follow -- <path>"
explanation = "Shows a file's history continuing past renames, so you see changes from before it was moved or renamed. Takes exactly one pathspec."
safety = "readonly"
requires = ["in-repo", "has-commits"]
warning = "Exactly one path — `--follow` errors with 'requires exactly one pathspec' if you pass zero or several."

[[painpoint]]
id = "reflog.find-deleted"
intents = [
  "find the commit that deleted a file",
  "when was this file deleted",
  "which commit removed this file",
  "recover a deleted file from history",
]
command = "git log --all --reflog --diff-filter=D -- <path>"
explanation = "Finds the commit that deleted <path>, searching all branches and the reflog so even orphaned or unreachable commits show up."
safety = "readonly"
requires = ["in-repo", "has-commits"]
warning = "Once you have the deleting commit's SHA, restore the file with: git checkout <sha>^ -- <path> (the ^ means the parent, where the file still existed)."

[[painpoint]]
id = "identity.who-am-i"
intents = [
  "who am i committing as",
  "what name and email will my commits use",
  "check my git identity",
  "which user will git stamp on my commits",
]
command = "git config user.name && git config user.email"
explanation = "Prints the name and email git will stamp on commits in this repo. Whoever — or whatever — runs `git commit` here commits as this identity; git records the configured user, never who actually ran the command."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "identity.commit-author"
intents = [
  "who is this commit attributed to",
  "who authored this commit",
  "what identity made this commit",
  "did i or something else make this commit",
]
command = "git log -1 --format=\"Author: %an <%ae> | Committer: %cn <%ce>\""
explanation = "Shows the author and committer recorded on the tip commit. If a script or agent committed on your machine it still shows YOUR configured identity — attribution is taken from machine config at commit time, with no record of the real operator unless a Co-Authored-By trailer was added."
safety = "readonly"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "pull.rebase-autostash"
intents = [
  "pull rebase but i have uncommitted changes",
  "pull-rebase over a dirty working tree",
  "rebase pull without stashing first",
  "update from remote while i have local edits",
]
command = "git pull --rebase --autostash"
explanation = "Auto-stashes your uncommitted changes, fetches and replays your commits on top of the remote, then re-applies the stash — a one-shot 'pull-rebase over a dirty tree' with no manual stash/pop."
safety = "history"
requires = ["in-repo", "has-commits", "has-upstream"]
warning = "If the rebase or the stash re-apply conflicts, resolve and `git rebase --continue`. Committing important work first resolves cleaner than a stash pop."

[[painpoint]]
id = "fetch.no-credential-hang"
intents = [
  "git fetch hangs forever",
  "git push freezes with no prompt",
  "git stuck waiting for a password in a script or agent",
  "make git fail fast instead of blocking on credentials",
]
command = "GIT_TERMINAL_PROMPT=0 git fetch"
explanation = "Disables git's credential prompt so a missing/expired credential makes the command fail fast instead of hanging forever waiting for input a non-interactive shell can never give."
safety = "readonly"
requires = ["in-repo", "has-remote"]
warning = "Use the same `GIT_TERMINAL_PROMPT=0` prefix on push/pull. If it now errors instead of hanging, fix the credential (credential manager or a PAT) — the hang was git silently waiting for one."

[[painpoint]]
id = "push.snapshot-branch"
intents = [
  "save my local work to a branch without rebasing",
  "main diverged i just want my commits on the remote",
  "preserve diverged work before reconciling later",
  "park my commits on a side branch to be safe",
]
command = "git push origin HEAD:<snapshot-branch>"
explanation = "Pushes your current commits to a NEW remote branch (e.g. laptop-snapshot-2026-05-23) without touching main — your work is safely on the remote even though your branch diverged, and you reconcile into main later with full context."
safety = "history"
requires = ["in-repo", "has-commits", "has-remote"]
warning = "This does NOT update main — it parks work on a side branch. Use a dated, descriptive <snapshot-branch> name. Reach for this instead of forcing a risky rebase when a branch is badly behind."

[[painpoint]]
id = "sync.commit-then-pull-then-push"
intents = [
  "safely sync a repo that has uncommitted changes",
  "commit and push but the remote already moved",
  "right order to commit pull and push",
  "fully sync this repo before switching machines",
]
command = "git add -A && git commit -m \"<msg>\" && git pull --rebase --autostash && git push"
explanation = "The safe order when a repo has BOTH local changes and a moved remote: commit first (work becomes a safe commit), then rebase-pull (clean conflict resolution, not a messy stash pop), then push. Commit-before-pull is the key."
safety = "history"
requires = ["in-repo", "has-remote"]
warning = "Review the diff before `add -A` so you don't commit junk or secrets. On rebase conflict: resolve, `git rebase --continue`, then push. Replace <msg> with a real message."

[[painpoint]]
id = "multi.audit-all-repos"
intents = [
  "status of all my repos at once",
  "which repos have uncommitted work",
  "audit every repo before switching machines",
  "find repos with unpushed or uncommitted changes",
]
command = '''for d in */; do d="${d%/}"; [ -d "$d/.git" ] || continue; printf '%-30s %s\n' "$d" "$(git -C "$d" status -sb | head -1)"; git -C "$d" status --porcelain | head -3; done'''
explanation = "Loops over every git repo in the current folder and prints each one's branch + ahead/behind and any uncommitted files — a fast 'state of all my repos' sweep before a device switch. No fetch, so it never stalls."
safety = "readonly"
requires = []
warning = "Run from the PARENT folder that holds the repos, not inside one. Ahead/behind is vs the last-known remote without a fetch; add `GIT_TERMINAL_PROMPT=0 git -C \"$d\" fetch` per repo to make it current (but that can stall on a repo with bad credentials)."

[[painpoint]]
id = "pr.list-open"
intents = [
  "is there an open pull request",
  "show open PRs for this repo",
  "are my changes stuck in an unmerged PR",
  "list pull requests",
]
command = "gh pr list --state open"
explanation = "Lists open pull requests for the current repo via the GitHub CLI - catches work that is pushed and waiting in a PR but NOT yet merged to the default branch, so it stays invisible on main."
safety = "readonly"
requires = ["in-repo", "has-remote"]
warning = "Needs the GitHub CLI gh installed and authed via gh auth login. From outside the repo use gh pr list -R owner/repo --state open."

[[painpoint]]
id = "pr.open-across-repos"
intents = [
  "open pull requests across all my repos",
  "where do i have open PRs",
  "find unmerged PRs in my whole account",
  "any open PRs anywhere",
]
command = "gh search prs --owner holbizmetrics --state open"
explanation = "Lists every open pull request across all of an owner's repos in one call - the fast way to find work parked in unmerged PRs anywhere, not just the repo you are standing in."
safety = "readonly"
requires = []
warning = "Needs the GitHub CLI gh authed. Replace holbizmetrics with your own GitHub owner or org."

# ── Harvested 2026-06-18 from a personal git cheatsheet (branches, blame, exclude,
#    tracking, staging, reset, diff, grep) — gaps the seed DB did not yet cover. ──

[[painpoint]]
id = "branch.new-from-main"
intents = [
  "start a new branch from main",
  "create a branch off main",
  "new branch from origin main",
  "branch from current main not my head",
]
command = "git fetch origin && git switch -c <new-branch> origin/main"
explanation = "Refreshes remote refs, then creates and switches to a new branch based on the CURRENT origin/main, not your possibly-stale local HEAD."
safety = "worktree"
requires = ["in-repo", "has-remote"]
warning = "Plain 'Create Branch' in editors branches from HEAD. Always base on origin/main."

[[painpoint]]
id = "branch.switch"
intents = [
  "switch to an existing branch",
  "checkout a branch",
  "change to another branch",
  "go to branch",
]
command = "git switch <branch>"
explanation = "Checks out an existing local branch. Use 'git switch -c' to create a new one."
safety = "worktree"
requires = ["in-repo"]

[[painpoint]]
id = "branch.set-upstream-no-push"
intents = [
  "set upstream without pushing",
  "track a remote branch",
  "link my branch to origin without push",
  "set tracking branch",
]
command = "git branch --set-upstream-to=origin/<branch>"
explanation = "Links the current branch to a remote tracking branch without pushing, so plain pull/push know where to go."
safety = "worktree"
requires = ["in-repo", "has-remote"]

[[painpoint]]
id = "blame.line-range"
intents = [
  "who wrote this line",
  "blame lines 50 to 80",
  "who changed this code",
  "last commit to touch this line",
]
command = "git blame -L <start>,<end> -- <file>"
explanation = "Shows the commit, author, and date for each line in the given range of a file."
safety = "readonly"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "blame.file"
intents = [
  "blame this file",
  "who wrote this file",
  "annotate file with authors",
  "line by line authorship",
]
command = "git blame -- <file>"
explanation = "Shows commit, author, and date for every line of a file."
safety = "readonly"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "blame.as-of-ref"
intents = [
  "blame as of main",
  "who wrote this on origin main not my working copy",
  "blame at a branch",
  "blame ignoring my local changes",
]
command = "git blame origin/main -- <file>"
explanation = "Blames the file as it exists at a given ref (e.g. origin/main) instead of your working tree."
safety = "readonly"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "exclude.local-ignore"
intents = [
  "ignore a file without gitignore",
  "stop a scratch file from showing in git",
  "ignore locally only not for everyone",
  "private ignore this file",
]
command = 'echo "<file>" >> .git/info/exclude'
explanation = "Adds a per-clone ignore rule that is never tracked or pushed - your private exclude list. Only works on untracked files."
safety = "worktree"
requires = ["in-repo"]
warning = "If the file is already tracked, run 'git rm --cached <file>' first."

[[painpoint]]
id = "exclude.unstage-scratch"
intents = [
  "i accidentally staged a scratch file",
  "unstage and ignore a file",
  "remove from staging and stop it showing",
]
command = 'git restore --staged <file> && echo "<file>" >> .git/info/exclude'
explanation = "Unstages a file (keeping it on disk) and adds it to the local exclude list so it stops appearing."
safety = "worktree"
requires = ["in-repo"]

[[painpoint]]
id = "track.is-tracked"
intents = [
  "is this file tracked",
  "does git track this file",
  "check if file is in the repo",
]
command = "git ls-files --error-unmatch -- <file>"
explanation = "Exits 0 if the file is tracked, non-zero if not. Handy in scripts."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "track.why-ignored"
intents = [
  "why is this file ignored",
  "which rule ignores this file",
  "what gitignore rule applies",
]
command = "git check-ignore -v <file>"
explanation = "Shows which ignore rule (and which file) causes a path to be ignored."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "track.untrack"
intents = [
  "untrack a file but keep it",
  "stop tracking without deleting",
  "remove from git but keep on disk",
]
command = "git rm --cached <file>"
explanation = "Stops tracking a file while leaving it on disk. Commit the removal and add it to .gitignore so it stays out."
safety = "worktree"
requires = ["in-repo"]

[[painpoint]]
id = "stage.interactive"
intents = [
  "stage parts of a file",
  "stage hunks interactively",
  "pick which changes to stage",
  "partial staging",
]
command = "git add -p"
explanation = "Interactively choose which hunks to stage, one at a time."
safety = "worktree"
requires = ["in-repo"]

[[painpoint]]
id = "stage.tracked"
intents = [
  "stage all tracked changes",
  "stage modified files but not new ones",
  "add changed files without untracked",
]
command = "git add -u"
explanation = "Stages changes to already-tracked files only; leaves untracked files alone."
safety = "worktree"
requires = ["in-repo"]

[[painpoint]]
id = "stage.all"
intents = [
  "stage everything",
  "add all changes including new files",
  "stage all",
]
command = "git add -A"
explanation = "Stages everything - modifications, deletions, AND untracked files."
safety = "worktree"
requires = ["in-repo"]
warning = "Sweeps untracked files too; check 'git status' first so you do not add scratch files."

[[painpoint]]
id = "reset.mixed"
intents = [
  "undo last commit keep changes unstaged",
  "uncommit but keep my edits",
  "undo commit to working tree",
]
command = "git reset --mixed HEAD~1"
explanation = "Removes the last commit but keeps its changes in your working tree, unstaged."
safety = "history"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "reset.hard"
intents = [
  "discard my last commit and changes",
  "throw away last commit completely",
  "hard reset one commit",
  "delete uncommitted work and last commit",
]
command = "git reset --hard HEAD~1"
explanation = "Removes the last commit AND discards all uncommitted changes in the working tree."
safety = "destructive"
requires = ["in-repo", "has-commits"]
warning = "Irreversible for uncommitted work. Recover the commit via 'git reflog' within ~30 days; uncommitted changes are gone."

[[painpoint]]
id = "diff.everything"
intents = [
  "show all my changes staged and unstaged",
  "diff everything against last commit",
  "full diff vs head",
]
command = "git diff HEAD"
explanation = "Shows working-tree AND staged changes together, compared to the last commit."
safety = "readonly"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "diff.name-only"
intents = [
  "which files changed",
  "list changed file names",
  "just the filenames not the diff",
]
command = "git diff --name-only"
explanation = "Lists only the names of files with unstaged changes, not the content."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "diff.ignore-whitespace"
intents = [
  "diff ignoring whitespace",
  "show changes but skip indentation",
  "diff without whitespace noise",
]
command = "git diff -b"
explanation = "Shows the diff while ignoring changes in the amount of whitespace."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "diff.word"
intents = [
  "word level diff",
  "diff by words not lines",
  "show prose changes inline",
]
command = "git diff --color-words"
explanation = "Highlights changes word-by-word instead of line-by-line - great for prose and comments."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "grep.tracked"
intents = [
  "search the code",
  "find a string in tracked files",
  "grep the repo",
  "search repository contents",
]
command = "git grep -n <pattern>"
explanation = "Searches tracked files for a pattern, with line numbers. Faster and cleaner than plain grep."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "status.short"
intents = [
  "compact status",
  "short status with branch",
  "quick status",
]
command = "git status -sb"
explanation = "Short, dense status with branch and ahead/behind info - the daily form."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "commit.amend-add-staged"
intents = [
  "add forgotten changes to last commit",
  "amend without changing the message",
  "fold staged changes into previous commit",
]
command = "git commit --amend --no-edit"
explanation = "Adds the currently staged changes to the last commit, keeping its message."
safety = "history"
requires = ["in-repo", "has-commits"]
warning = "Rewrites the last commit. If it was already pushed, you will need 'git push --force-with-lease'."

[[painpoint]]
id = "pager.no-pager"
intents = [
  "dont use the pager",
  "print git output inline",
  "disable less for git",
]
command = "git --no-pager log -20"
explanation = "Runs a git command without the interactive pager, dumping output straight to the terminal. The --no-pager flag works on any subcommand."
safety = "readonly"
requires = ["in-repo", "has-commits"]

[[painpoint]]
id = "files.list-tracked"
intents = [
  "list all files in the repo",
  "list all tracked files",
  "show all files git knows about",
  "what files are in the repository",
  "list files",
]
command = "git ls-files"
explanation = "Lists every tracked file in the repository."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "files.list-untracked"
intents = [
  "list untracked files",
  "show files not in git",
  "what files are not tracked",
  "list new files not added yet",
]
command = "git ls-files --others --exclude-standard"
explanation = "Lists files that are neither tracked nor ignored - the new files you have not added."
safety = "readonly"
requires = ["in-repo"]

[[painpoint]]
id = "diff.previous-commit"
intents = [
  "compare to the previous version",
  "what changed in the last commit",
  "compare to the previous commit",
  "diff the last commit",
  "what did the last commit change",
]
command = "git diff HEAD~1 HEAD"
explanation = "Shows what changed in the most recent commit, comparing it to the commit before it."
safety = "readonly"
requires = ["in-repo", "has-commits"]

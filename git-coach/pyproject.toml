[project]
name = "git-coach"
version = "0.1.0"
description = "A deterministic git coach that maps plain-language intents to git commands and shows the command before running it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "holbizmetrics" }]
dependencies = ["rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
git-coach = "git_coach:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_coach"]

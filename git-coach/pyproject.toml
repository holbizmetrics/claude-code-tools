[project]
name = "git-coach"
version = "0.2.0"
description = "A deterministic, offline git multitool: a plain-words coaching mode that maps intents to exact git commands, plus content-addressed provenance commands (locate/dedup)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "holbizmetrics" }]
dependencies = ["rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
git-coach = "git_coach:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_coach"]
